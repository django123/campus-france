# wp-config.php évalue WORDPRESS_CONFIG_EXTRA depuis l'environnement du conteneur,
# à chaque exécution (voir getenv_docker dans wp-config.php). Cette ancre garantit
# que WP-CLI voit les mêmes constantes que le serveur web : sans elle,
# wp_get_environment_type() renvoie « production » en ligne de commande alors que
# le site tourne en « local », et les comportements conditionnés par
# l'environnement divergent selon le point d'entrée.
x-wp-config-extra: &wp_config_extra |
  define('WP_DEBUG_LOG', true);
  define('WP_DEBUG_DISPLAY', false);
  define('WP_MEMORY_LIMIT', '256M');
  define('WP_ENVIRONMENT_TYPE', 'local');
  define('DISALLOW_FILE_EDIT', true);

services:
  db:
    image: mariadb:11
    container_name: cc_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6-php8.3-apache
    container_name: cc_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: cc_
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    volumes:
      - wp_core:/var/www/html
      # Seul le code versionné est monté : thème enfant + mu-plugins
      - ./wp-content/themes/campus-connect:/var/www/html/wp-content/themes/campus-connect
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  wpcli:
    image: wordpress:cli-php8.3
    container_name: cc_cli
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: cc_
      # Mêmes constantes que le serveur web (voir l'ancre en tête de fichier),
      # pour que WP-CLI et le site voient le même environnement.
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
      # Consommées par scripts/install.sh
      SITE_URL: ${SITE_URL}
      SITE_TITLE: ${SITE_TITLE}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes_from:
      - wordpress
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["wp"]
    command: ["--info"]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: cc_pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 128M

  mailpit:
    image: axllent/mailpit:latest
    container_name: cc_mail
    restart: unless-stopped
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  db_data:
  wp_core:
