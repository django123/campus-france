<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="Campus Connect">
  <title>Campus Connect — logo provisoire</title>
  <!-- Marque : une passerelle entre deux points, le point d'arrivée en vert -->
  <g fill="none" stroke-linecap="round">
    <path d="M14 50 C 14 18, 58 18, 58 50" stroke="#1565C0" stroke-width="5"/>
    <circle cx="14" cy="50" r="7" fill="#1565C0" stroke="none"/>
    <circle cx="58" cy="50" r="7" fill="#17A673" stroke="none"/>
  </g>
  <text x="80" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700" fill="#0B3C7D" letter-spacing="-0.3">Campus</text>
  <text x="189" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="400" fill="#1565C0" letter-spacing="-0.3">Connect</text>
  <text x="81" y="60" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5A6B7B" letter-spacing="1.6">ÉTUDIER EN FRANCE</text>
</svg>
